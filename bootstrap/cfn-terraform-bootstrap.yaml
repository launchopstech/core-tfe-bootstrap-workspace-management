AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for HCP Terraform Dynamic Provider Credentials.
  Creates the OIDC provider and TerraformDeployRole so HCP Terraform
  workspaces can authenticate to this AWS account without long-lived keys.
  Supports unlimited clients per account — trust is scoped to HCP Terraform
  project boundaries, not per-client workspace name patterns.

Parameters:
  HCPOrganization:
    Type: String
    Default: "core-aws"
    Description: Your HCP Terraform organization name.

  HCPBootstrapProject:
    Type: String
    Description: >
      HCP Terraform project that hosts bootstrap workspaces
      (e.g. bootstrap-dev). All workspaces in this project are trusted.
    AllowedPattern: "^[^*]+$"
    ConstraintDescription: Must be an explicit project name — no wildcards.

  HCPTeamProject:
    Type: String
    Description: >
      HCP Terraform project that hosts team and service workspaces
      (e.g. team-dev). All workspaces in this project are trusted.
    AllowedPattern: "^[^*]+$"
    ConstraintDescription: Must be an explicit project name — no wildcards.

  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of an existing HCP Terraform OIDC provider
      (arn:aws:iam::<account>:oidc-provider/app.terraform.io).
      Leave empty to create a new one. Set this when the provider already
      exists in the account to avoid a 409 AlreadyExists error.

  KMSAliasName:
    Type: String
    Description: >
      Alias for the platform KMS key. Format: alias/<name>.
      Recommended: alias/<account-nickname>-platform (e.g. alias/dev-shared-platform).
    AllowedPattern: "^alias/[a-zA-Z0-9:/_-]+$"
    ConstraintDescription: Must begin with alias/ and contain only alphanumeric characters, colons, slashes, underscores, or hyphens.

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, ""]

Resources:

  ##############################################################################
  # OIDC Provider — trusts HCP Terraform token issuer
  #
  # Thumbprint: SHA-1 of the root CA for app.terraform.io (DigiCert Global Root G2).
  # Verify with:
  #   openssl s_client -connect app.terraform.io:443 -showcerts 2>/dev/null \
  #     | openssl x509 -fingerprint -sha1 -noout | tr -d ':' | tr 'A-F' 'a-f'
  # If HashiCorp rotates their TLS cert, update this thumbprint and redeploy.
  #
  # Skipped when ExistingOIDCProviderArn is supplied (already exists in account).
  ##############################################################################
  HCPTerraformOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://app.terraform.io
      ClientIdList:
        - aws.workload.identity
      ThumbprintList:
        - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280

  ##############################################################################
  # TerraformDeployPolicy — least-privilege policy for platform services
  # Covers: vpc, eks, rds, lambda, api-gateway, wafv2, route53, acm, s3, kms,
  # iam-access, secure-baseline, account-bootstrap
  ##############################################################################
  TerraformDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Least-privilege policy for HCP Terraform workspaces: VPC, EKS, RDS, Lambda, API Gateway, WAFv2, Route53, ACM, S3, KMS, CloudTrail, Config, GuardDuty, and scoped IAM."
      PolicyDocument:
        Version: "2012-10-17"
        Statement:

          # ── Networking / VPC ─────────────────────────────────────────────────
          - Sid: VPCAndNetworking
            Effect: Allow
            Action:
              - ec2:*
            Resource: "*"

          # ── EKS ──────────────────────────────────────────────────────────────
          - Sid: EKS
            Effect: Allow
            Action:
              - eks:*
            Resource: "*"

          # ── RDS ──────────────────────────────────────────────────────────────
          - Sid: RDS
            Effect: Allow
            Action:
              - rds:*
            Resource: "*"

          # ── Lambda ───────────────────────────────────────────────────────────
          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:*
            Resource: "*"

          # ── API Gateway ──────────────────────────────────────────────────────
          - Sid: APIGateway
            Effect: Allow
            Action:
              - apigateway:*
            Resource: "*"

          # ── WAFv2 ────────────────────────────────────────────────────────────
          - Sid: WAFv2
            Effect: Allow
            Action:
              - wafv2:*
            Resource: "*"

          # ── Route53 ──────────────────────────────────────────────────────────
          - Sid: Route53
            Effect: Allow
            Action:
              - route53:*
            Resource: "*"

          # ── ACM ──────────────────────────────────────────────────────────────
          - Sid: ACM
            Effect: Allow
            Action:
              - acm:*
            Resource: "*"

          # ── S3 ───────────────────────────────────────────────────────────────
          - Sid: S3
            Effect: Allow
            Action:
              - s3:*
            Resource: "*"

          # ── KMS ──────────────────────────────────────────────────────────────
          - Sid: KMS
            Effect: Allow
            Action:
              - kms:*
            Resource: "*"

          # ── Secure baseline (CloudTrail, Config, GuardDuty, SecurityHub) ─────
          - Sid: SecureBaseline
            Effect: Allow
            Action:
              - cloudtrail:*
              - config:*
              - guardduty:*
              - securityhub:*
              - access-analyzer:*
            Resource: "*"

          # ── Logging and monitoring ───────────────────────────────────────────
          - Sid: LogsAndMonitoring
            Effect: Allow
            Action:
              - logs:*
              - cloudwatch:*
              - events:*
              - sns:*
            Resource: "*"

          # ── Parameter Store and Secrets Manager ──────────────────────────────
          - Sid: SSMAndSecrets
            Effect: Allow
            Action:
              - ssm:*
              - secretsmanager:*
            Resource: "*"

          # ── IAM — service roles, instance profiles, OIDC providers ───────────
          # Excludes user/group/access-key management (see DenyPrivilegeEscalation).
          # PassRole is scoped to specific AWS services via a condition.
          - Sid: IAMServiceRolesAndPolicies
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRoles
              - iam:ListRoleTags
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:ListInstanceProfiles
              - iam:ListInstanceProfilesForRole
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicies
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
              - iam:CreateOpenIDConnectProvider
              - iam:TagOpenIDConnectProvider
              - iam:UntagOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:GetOpenIDConnectProvider
              - iam:ListOpenIDConnectProviderTags
              - iam:ListOpenIDConnectProviders
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:CreateServiceLinkedRole
              - iam:DeleteServiceLinkedRole
              - iam:GetServiceLinkedRoleDeletionStatus
            Resource: "*"

          # ── IAM PassRole — scoped to the services Terraform manages ──────────
          # Prevents passing a privileged role to arbitrary AWS services.
          - Sid: IAMPassRole
            Effect: Allow
            Action: iam:PassRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - ec2.amazonaws.com
                  - eks.amazonaws.com
                  - rds.amazonaws.com
                  - apigateway.amazonaws.com
                  - config.amazonaws.com
                  - cloudtrail.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - lambda.amazonaws.com

          # ── Explicit deny: privilege escalation via IAM users/groups ─────────
          - Sid: DenyPrivilegeEscalation
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:DeleteLoginProfile
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:AddUserToGroup
              - iam:CreateGroup
              - iam:AttachGroupPolicy
              - iam:PutGroupPolicy
            Resource: "*"

          # ── Explicit deny: self-modification of TerraformDeployRole ──────────
          # Prevents Terraform from backdooring or escalating its own role.
          - Sid: DenySelfModification
            Effect: Deny
            Action:
              - iam:UpdateAssumeRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:DeleteRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/TerraformDeployRole"

          # ── Explicit deny: secret and parameter reads ─────────────────────────
          # Terraform manages secret/parameter lifecycle — it should not read values.
          - Sid: DenySecretAndParameterRead
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
            Resource: "*"

          # ── Explicit deny: KMS key policy and deletion ────────────────────────
          # Prevents rewriting KMS key policies to grant external access.
          - Sid: DenyKMSPolicyModification
            Effect: Deny
            Action:
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
            Resource: "*"

          # ── Explicit deny: audit trail tampering ──────────────────────────────
          # Prevents blinding CloudTrail/Config/GuardDuty before an attack.
          - Sid: DenyAuditTamper
            Effect: Deny
            Action:
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - config:DeleteConfigurationRecorder
              - config:StopConfigurationRecorder
              - config:DeleteDeliveryChannel
              - guardduty:DeleteDetector
              - guardduty:DisassociateFromMasterAccount
              - securityhub:DisableSecurityHub
            Resource: "*"

          # ── Explicit deny: S3 data exfiltration ──────────────────────────────
          # Prevents reading arbitrary object data from buckets Terraform does
          # not own. Code buckets (*-api-code, *-lambda-code) are exempted so
          # Terraform can manage aws_s3_object resources (HeadObject requires
          # s3:GetObject — there is no separate s3:HeadObject IAM action).
          - Sid: DenyS3ObjectRead
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            NotResource:
              - "arn:aws:s3:::*-api-code/*"
              - "arn:aws:s3:::*-api-code-*/*"
              - "arn:aws:s3:::*-lambda-code/*"
              - "arn:aws:s3:::*-lambda-code-*/*"

          # Prevents making buckets or objects publicly accessible.
          - Sid: DenyS3AclChanges
            Effect: Deny
            Action:
              - s3:PutBucketAcl
              - s3:PutObjectAcl
            Resource: "*"

          # ── Explicit deny: EC2 snapshot/image sharing ─────────────────────────
          # Prevents exfiltrating data via cross-account snapshot sharing.
          - Sid: DenyEC2DataExfiltration
            Effect: Deny
            Action:
              - ec2:ModifySnapshotAttribute
              - ec2:ModifyImageAttribute
              - ec2:CopySnapshot
            Resource: "*"

  ##############################################################################
  # TerraformDeployRole — assumed by HCP Terraform workspaces via OIDC
  #
  # Trust is scoped to the HCP Terraform project level (not per-client workspace
  # name). This supports unlimited clients per account without template changes.
  #
  # Security model: the trust boundary is enforced by HCP Terraform project
  # access control. Only workspaces the agency places in HCPBootstrapProject
  # or HCPTeamProject can assume this role. This is appropriate when the agency
  # owns and controls both HCP Terraform projects.
  ##############################################################################
  TerraformDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TerraformDeployRole
      Description: >
        Assumed by HCP Terraform workspaces via OIDC. Grants Terraform the
        permissions needed to manage platform infrastructure in this account.
        Trusts all workspaces in the configured HCP Terraform projects.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # All workspaces in the bootstrap project (bootstrap-<client>-<env>)
          - Sid: AllowBootstrapProject
            Effect: Allow
            Principal:
              Federated: !If [CreateOIDCProvider, !GetAtt HCPTerraformOIDCProvider.Arn, !Ref ExistingOIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                app.terraform.io:aud: aws.workload.identity
              StringLike:
                app.terraform.io:sub: !Sub
                  - "organization:${Org}:project:${BootstrapProject}:workspace:*:run_phase:*"
                  - Org: !Ref HCPOrganization
                    BootstrapProject: !Ref HCPBootstrapProject
          # All workspaces in the team project (<client>-<env> and <client>-<env>-<service>)
          - Sid: AllowTeamProject
            Effect: Allow
            Principal:
              Federated: !If [CreateOIDCProvider, !GetAtt HCPTerraformOIDCProvider.Arn, !Ref ExistingOIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                app.terraform.io:aud: aws.workload.identity
              StringLike:
                app.terraform.io:sub: !Sub
                  - "organization:${Org}:project:${TeamProject}:workspace:*:run_phase:*"
                  - Org: !Ref HCPOrganization
                    TeamProject: !Ref HCPTeamProject
      ManagedPolicyArns:
        - !Ref TerraformDeployPolicy
      Tags:
        - Key: ManagedBy
          Value: terraform
        - Key: RoleClass
          Value: automation

  ##############################################################################
  # KMS key — platform encryption key used by secure-baseline
  ##############################################################################
  PlatformKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Platform encryption key for CloudTrail, Config, GuardDuty logs
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: TerraformDeployRoleKeyUsage
            Effect: Allow
            Principal:
              AWS: !GetAtt TerraformDeployRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource: "*"
          - Sid: AWSServicesKeyUsage
            Effect: Allow
            Principal:
              Service:
                - cloudtrail.amazonaws.com
                - config.amazonaws.com
                - logs.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
            Resource: "*"
      Tags:
        - Key: ManagedBy
          Value: terraform
        - Key: KeyClass
          Value: platform

  PlatformKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KMSAliasName
      TargetKeyId: !Ref PlatformKMSKey

Outputs:
  TerraformDeployRoleArn:
    Description: Set this as TFC_AWS_RUN_ROLE_ARN in HCP Terraform workspace.
    Value: !GetAtt TerraformDeployRole.Arn

  TerraformDeployPolicyArn:
    Description: ARN of the managed policy attached to TerraformDeployRole.
    Value: !Ref TerraformDeployPolicy

  OIDCProviderArn:
    Description: ARN of the HCP Terraform OIDC provider.
    Value: !If [CreateOIDCProvider, !GetAtt HCPTerraformOIDCProvider.Arn, !Ref ExistingOIDCProviderArn]

  PlatformKMSKeyArn:
    Description: Set this as kms_key_arn in workspace variables.
    Value: !GetAtt PlatformKMSKey.Arn

  PlatformKMSKeyId:
    Description: KMS key ID.
    Value: !Ref PlatformKMSKey
